name: Slack Notification

on:
  workflow_run:
    workflows:
      - AI CI
      - PR Title
      - Jira Key
      - Component Sync
      - Close Linked Issues
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: slack-notification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    name: slack-notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 검증된 Slack helper 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DodamDodam-Capstone/integration
          ref: 37f994f5fbdf18ea1b68ba058d7ab97f5a1c806d
          path: .automation
          persist-credentials: false

      - name: AI Slack 채널에 결과 전송
        run: python3 .automation/.github/scripts/notify_workflow_run_to_slack.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_API_TOKEN: ${{ github.token }}
