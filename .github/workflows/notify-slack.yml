name: Slack Notification

on:
  workflow_run:
    workflows: ["AI CI", "PR Title", "Component Sync"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: slack-notification
    runs-on: ubuntu-latest
    steps:
      - name: Send workflow result to repository Slack channel
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          import json
          import os
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook:
              print("SLACK_WEBHOOK_URL is not configured; notification skipped.")
              raise SystemExit(0)

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          run = event["workflow_run"]
          repository = run["repository"]["full_name"]
          workflow = run["name"]
          conclusion = run.get("conclusion") or "unknown"
          trigger = run.get("event") or "unknown"
          head_branch = run.get("head_branch") or "—"
          head_sha = run.get("head_sha") or ""
          actor = (run.get("actor") or {}).get("login") or "unknown"
          run_url = run["html_url"]
          pull_requests = run.get("pull_requests") or []

          # GitHub omits workflow_run.pull_requests when an already merged PR is rerun.
          # Recover the associated PR from the commit so branch flow stays explicit.
          if trigger == "pull_request" and not pull_requests and head_sha:
              api_request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{head_sha}/pulls",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_API_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(api_request, timeout=15) as response:
                  associated_prs = json.load(response)
              pull_requests = [
                  pr for pr in associated_prs
                  if (pr.get("head") or {}).get("ref") == head_branch
              ] or associated_prs[:1]
          source_branch = "—"
          target_branch = head_branch
          pr_number = None
          pr_url = None
          if pull_requests:
              pull_request = pull_requests[0]
              source_branch = (pull_request.get("head") or {}).get("ref") or head_branch
              target_branch = (pull_request.get("base") or {}).get("ref") or "—"
              pr_number = pull_request.get("number")
              if pr_number:
                  pr_url = f"{run['repository']['html_url']}/pull/{pr_number}"
          elif trigger != "push":
              source_branch = head_branch
              target_branch = "—"
          def parse_time(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))
          started_at = parse_time(run.get("run_started_at") or run.get("created_at"))
          finished_at = parse_time(run.get("updated_at"))
          duration = "unknown"
          if started_at and finished_at:
              total_seconds = max(0, int((finished_at - started_at).total_seconds()))
              minutes, seconds = divmod(total_seconds, 60)
              duration = f"{minutes}m {seconds}s" if minutes else f"{seconds}s"
          icon = {
              "success": "✅",
              "failure": "❌",
              "cancelled": "⚪",
              "timed_out": "⏰",
          }.get(conclusion, "ℹ️")
          sha = head_sha[:7] if head_sha else "unknown"
          text = f"{icon} {conclusion.upper()} | {repository} | {workflow}"
          flow = f"`{source_branch}` → `{target_branch}`"
          pr_text = f"<{pr_url}|#{pr_number}>" if pr_url else "—"
          commit_url = f"{run['repository']['html_url']}/commit/{head_sha}"
          commit_text = f"<{commit_url}|`{sha}`>" if head_sha else "unknown"
          payload = {
              "text": text,
              "blocks": [
                  {
                      "type": "header",
                      "text": {"type": "plain_text", "text": text},
                  },
                  {
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": f"*Branch flow*\n{flow}"},
                  },
                  {
                      "type": "section",
                      "fields": [
                          {"type": "mrkdwn", "text": f"*Source branch*\n`{source_branch}`"},
                          {"type": "mrkdwn", "text": f"*Target branch*\n`{target_branch}`"},
                          {"type": "mrkdwn", "text": f"*Trigger*\n`{trigger}`"},
                          {"type": "mrkdwn", "text": f"*Pull request*\n{pr_text}"},
                          {"type": "mrkdwn", "text": f"*Commit*\n{commit_text}"},
                          {"type": "mrkdwn", "text": f"*Actor*\n`{actor}`"},
                          {"type": "mrkdwn", "text": f"*Run*\n#{run['run_number']} (attempt {run['run_attempt']})"},
                          {"type": "mrkdwn", "text": f"*Duration*\n{duration}"},
                      ],
                  },
                  {
                      "type": "actions",
                      "elements": [
                          {
                              "type": "button",
                              "text": {"type": "plain_text", "text": "View GitHub Actions"},
                              "url": run_url,
                          }
                      ] + ([{
                          "type": "button",
                          "text": {"type": "plain_text", "text": "View Pull Request"},
                          "url": pr_url,
                      }] if pr_url else []),
                  },
              ],
          }
          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack returned HTTP {response.status}")
          PY
