name: Slack Notification

on:
  workflow_run:
    workflows: ["AI CI", "PR Title", "Component Sync"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    name: slack-notification
    runs-on: ubuntu-latest
    steps:
      - name: Send workflow result to repository Slack channel
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook:
              print("SLACK_WEBHOOK_URL is not configured; notification skipped.")
              raise SystemExit(0)

          conclusion = os.environ["CONCLUSION"]
          icon = {
              "success": "✅",
              "failure": "❌",
              "cancelled": "⚪",
              "timed_out": "⏰",
          }.get(conclusion, "ℹ️")
          sha = os.environ["HEAD_SHA"][:7]
          text = (
              f"{icon} {os.environ['REPOSITORY']} — "
              f"{os.environ['WORKFLOW']}: {conclusion}"
          )
          payload = {
              "text": text,
              "blocks": [
                  {
                      "type": "header",
                      "text": {"type": "plain_text", "text": text},
                  },
                  {
                      "type": "section",
                      "fields": [
                          {"type": "mrkdwn", "text": f"*Branch*\n{os.environ['HEAD_BRANCH']}"},
                          {"type": "mrkdwn", "text": f"*Event*\n{os.environ['EVENT_NAME']}"},
                          {"type": "mrkdwn", "text": f"*Commit*\n`{sha}`"},
                          {"type": "mrkdwn", "text": f"*Actor*\n{os.environ['ACTOR']}"},
                      ],
                  },
                  {
                      "type": "actions",
                      "elements": [
                          {
                              "type": "button",
                              "text": {"type": "plain_text", "text": "View GitHub Actions"},
                              "url": os.environ["RUN_URL"],
                          }
                      ],
                  },
              ],
          }
          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack returned HTTP {response.status}")
          PY

