name: AI CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
permissions:
  contents: read
concurrency:
  group: ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: ai-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Python project
        id: project
        shell: bash
        run: |
          if [[ -f uv.lock ]]; then
            echo "mode=uv" >> "$GITHUB_OUTPUT"
          elif [[ -f requirements.txt ]]; then
            echo "mode=requirements" >> "$GITHUB_OUTPUT"
          elif [[ -f pyproject.toml ]]; then
            echo "mode=pyproject" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f .python-version ]]; then
            echo "A Python project is configured but .python-version is missing." >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.project.outputs.mode != 'none'
        with:
          python-version-file: .python-version
      - name: Repository readiness
        if: steps.project.outputs.mode == 'none'
        run: echo "AI source is not initialized yet; CI configuration is ready."
      - name: Set up uv
        if: steps.project.outputs.mode == 'uv'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          enable-cache: true
      - name: Install uv project
        if: steps.project.outputs.mode == 'uv'
        run: uv sync --all-extras --dev --frozen
      - name: Install requirements project
        if: steps.project.outputs.mode == 'requirements'
        run: python -m pip install -r requirements.txt
      - name: Install pyproject project
        if: steps.project.outputs.mode == 'pyproject'
        run: python -m pip install -e '.[dev]'
      - name: Python checks with uv
        if: steps.project.outputs.mode == 'uv'
        run: |
          uv run python -m compileall .
          uv run ruff check .
          uv run pytest
      - name: Python checks with pip
        if: steps.project.outputs.mode == 'requirements' || steps.project.outputs.mode == 'pyproject'
        run: |
          python -m compileall .
          if command -v ruff >/dev/null 2>&1; then ruff check .; fi
          if command -v pytest >/dev/null 2>&1; then pytest; fi
