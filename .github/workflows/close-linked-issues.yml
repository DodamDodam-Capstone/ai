name: Close Linked Issues

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: close-linked-issues-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-linked-issues:
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'development' ||
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 검증된 Issue helper 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DodamDodam-Capstone/integration
          ref: 37f994f5fbdf18ea1b68ba058d7ab97f5a1c806d
          path: .automation
          persist-credentials: false

      - name: PR 본문의 연결된 Issue 완료 처리
        run: python3 .automation/.github/scripts/close_linked_issues.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
