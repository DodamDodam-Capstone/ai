name: Jira Key

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  jira-issue-key:
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Jira 키와 저장소 접두어 검사
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          actor = os.environ["ACTOR"]
          head = os.environ["HEAD_REF"]
          title = os.environ["PR_TITLE"]
          base = os.environ["BASE_REF"]
          if actor == "dependabot[bot]" or head.startswith("bot/"):
              print("자동화 PR은 Jira 키 검사를 건너뜁니다.")
              raise SystemExit(0)
          keys = set(re.findall(r"\bSCRUM-\d+\b", f"{head} {title}"))
          if len(keys) != 1:
              print("PR 제목과 브랜치에는 정확히 하나의 SCRUM Jira 키가 필요합니다.")
              raise SystemExit(1)
          if base == "development" and "[AI]" not in title:
              print("AI 작업 PR 제목에는 [AI]가 필요합니다.")
              raise SystemExit(1)
          print(f"Jira 키 검증 완료: {next(iter(keys))}")
          PY
