name: "🛠️ AI Task"
description: "AI 구현·실험·문서 업무를 등록합니다. Jira Task가 자동 생성됩니다."
title: "[AI] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "Jira Task가 아직 없을 때만 사용합니다. Jira 키와 Slack 알림이 바로 추가되지 않으면 팀원이 내용을 검토한 뒤 jira-sync 레이블을 추가하세요."
  - type: input
    id: parent_jira
    attributes:
      label: "상위 Jira 키 (선택)"
      description: "기존 Epic 아래에 둘 경우 SCRUM-6 형식으로 입력하세요."
      placeholder: "SCRUM-6"
  - type: textarea
    id: goal
    attributes:
      label: "완료 목표"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건"
      value: |
        - [ ] 구현·실험 또는 문서 변경 완료
        - [ ] 필요한 테스트 통과
        - [ ] development 대상 PR 준비
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "참고 사항"
